VERSION: 1.0.0.1
DATABASE: testdb
USER: testuser
HOST: localhost
PORT: 5432
GPLOAD:
  INPUT:
    - SOURCE:
        LOCAL_HOSTNAME:
          - gpload-test
        FILE:
          - tests/fixtures/data/merge.csv
    - FORMAT: csv
    - QUOTE: '"'
  OUTPUT:
    - TABLE: public.load_test
    - MODE: merge
    - MATCH_COLUMNS:
        - id
    - UPDATE_COLUMNS:
        - name
        - amount
