VERSION: 1.0.0.1
DATABASE: testdb
USER: testuser
HOST: localhost
PORT: 5432
GPLOAD:
  INPUT:
    - SOURCE:
        LOCAL_HOSTNAME:
          - gpload-test
        FILE:
          - tests/fixtures/data/columns.csv
    - FORMAT: csv
    - QUOTE: '"'
    - COLUMNS:
        - id: integer
        - name: text
        - extra: text
        - amount: numeric
  OUTPUT:
    - TABLE: public.load_test
    - MODE: insert
    - MAPPING:
        name: extra
        amount: amount
